# ============================================================
# ML Deployment Job — PL Application Scorecard
# ============================================================
# Evaluate -> Approve -> Deploy
# Promotes @Challenger -> @Champion in Unity Catalog.
#
# Bound to the UC model as an MLflow 3 Deployment Job.
# Auto-fired by Databricks when a new model version is registered.
# Receives `model_name` and `model_version` from the platform.
#
# Manual trigger:
#   databricks bundle run ml_pl_deployment --target stg
# ============================================================

resources:
  jobs:

    ml_pl_deployment:
      name: "asb-ml-pl-deployment-${var.environment}"
      description: "PL Application Scorecard — Evaluate, Approve, Deploy (@Challenger -> @Champion)"
      tags:
        product: "personal_loan"
        pipeline: "deployment"
        scorecard_variant: "application"

      email_notifications:
        on_failure:
          - "${var.notify_email}"
        on_success:
          - "${var.notify_email}"

      parameters:
        - name: catalog
          default: "${var.catalog}"
        - name: environment
          default: "${var.environment}"
        - name: model_name
          default: ""
        - name: model_version
          default: ""

      tasks:
        - task_key: model_evaluation
          notebook_task:
            notebook_path: ../notebooks/ml/04_model_evaluation.py
            base_parameters:
              catalog: "${var.catalog}"
              model_name: "{{job.parameters.model_name}}"
              model_version: "{{job.parameters.model_version}}"
          environment_key: ml_default

        - task_key: model_approval
          depends_on:
            - task_key: model_evaluation
          notebook_task:
            notebook_path: ../notebooks/ml/05_model_approval.py
            base_parameters:
              catalog: "${var.catalog}"
              environment: "${var.environment}"
              model_name: "{{job.parameters.model_name}}"
              model_version: "{{job.parameters.model_version}}"
          environment_key: ml_default

        - task_key: model_deployment
          depends_on:
            - task_key: model_approval
          notebook_task:
            notebook_path: ../notebooks/ml/06_model_deployment.py
            base_parameters:
              catalog: "${var.catalog}"
              environment: "${var.environment}"
              model_name: "{{job.parameters.model_name}}"
              model_version: "{{job.parameters.model_version}}"
          environment_key: ml_default

      environments:
        - environment_key: ml_default
          spec:
            client: "2"
            dependencies:
              - databricks-feature-engineering
