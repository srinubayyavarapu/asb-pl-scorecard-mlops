# ============================================================
# ETL Pipeline: Snowflake -> Bronze -> Silver -> Gold
# ASB PL Application Scorecard demo
# ============================================================
# Single orchestrating job. 4 source tables ingest in parallel,
# each runs Bronze -> Silver, then a single Silver -> Gold join.
#
# Source: DP_CREDITMANAGEMENT.MART (Snowflake, JDBC)
# Inventory: configs/ingestion/master_table_inventory.csv (4 rows)
#
# Usage:
#   databricks bundle run etl_pl_application_pipeline --target dev
# ============================================================

resources:
  jobs:

    etl_pl_application_pipeline:
      name: "asb-etl-pl-application-pipeline-${var.environment}"
      description: "PL Application — Snowflake to Gold (Bronze, Silver SCD2, Gold join)"
      tags:
        product: "personal_loan"
        pipeline: "etl"
        scorecard_variant: "application"

      parameters:
        - name: catalog
          default: "${var.catalog}"
        - name: environment
          default: "${var.environment}"
        - name: snowflake_database
          default: "${var.snowflake_database}"
        - name: force_full_load
          default: "N"

      # ── Inventory rows in master_table_inventory.csv ──
      # 0 = APPLICATIONS         (SCD2)
      # 1 = FACILITIES           (SCD2)
      # 2 = CREDIT_PERFORMANCE   (append-only)
      # 3 = SAS_FINAL_SCORES     (SCD2)
      tasks:

        # ── APPLICATIONS ─────────────────────────────────────
        - task_key: ingest_applications
          notebook_task:
            notebook_path: ../notebooks/etl/01_ingest_snowflake.py
            base_parameters:
              table_name: "APPLICATIONS"
              catalog: "{{job.parameters.catalog}}"
              snowflake_database: "{{job.parameters.snowflake_database}}"
              force_full_load: "{{job.parameters.force_full_load}}"
          environment_key: etl_default

        - task_key: silver_applications
          depends_on:
            - task_key: ingest_applications
          notebook_task:
            notebook_path: ../notebooks/etl/02_bronze_to_silver.py
            base_parameters:
              row_index: "0"
              catalog: "${var.catalog}"
              environment: "${var.environment}"
              bronze_schema: "retail_bronze"
              silver_schema: "retail_silver"
              gold_schema: "retail_gold"
              ml_schema: "retail_ml"
          environment_key: etl_default

        # ── FACILITIES ───────────────────────────────────────
        - task_key: ingest_facilities
          notebook_task:
            notebook_path: ../notebooks/etl/01_ingest_snowflake.py
            base_parameters:
              table_name: "FACILITIES"
              catalog: "{{job.parameters.catalog}}"
              snowflake_database: "{{job.parameters.snowflake_database}}"
              force_full_load: "{{job.parameters.force_full_load}}"
          environment_key: etl_default

        - task_key: silver_facilities
          depends_on:
            - task_key: ingest_facilities
          notebook_task:
            notebook_path: ../notebooks/etl/02_bronze_to_silver.py
            base_parameters:
              row_index: "1"
              catalog: "${var.catalog}"
              environment: "${var.environment}"
              bronze_schema: "retail_bronze"
              silver_schema: "retail_silver"
              gold_schema: "retail_gold"
              ml_schema: "retail_ml"
          environment_key: etl_default

        # ── CREDIT_PERFORMANCE (append-only) ─────────────────
        - task_key: ingest_credit_performance
          notebook_task:
            notebook_path: ../notebooks/etl/01_ingest_snowflake.py
            base_parameters:
              table_name: "CREDIT_PERFORMANCE"
              catalog: "{{job.parameters.catalog}}"
              snowflake_database: "{{job.parameters.snowflake_database}}"
              force_full_load: "{{job.parameters.force_full_load}}"
          environment_key: etl_default

        - task_key: silver_credit_performance
          depends_on:
            - task_key: ingest_credit_performance
          notebook_task:
            notebook_path: ../notebooks/etl/02_bronze_to_silver.py
            base_parameters:
              row_index: "2"
              catalog: "${var.catalog}"
              environment: "${var.environment}"
              bronze_schema: "retail_bronze"
              silver_schema: "retail_silver"
              gold_schema: "retail_gold"
              ml_schema: "retail_ml"
          environment_key: etl_default

        # ── SAS_FINAL_SCORES ─────────────────────────────────
        - task_key: ingest_sas_scores
          notebook_task:
            notebook_path: ../notebooks/etl/01_ingest_snowflake.py
            base_parameters:
              table_name: "SAS_FINAL_SCORES"
              catalog: "{{job.parameters.catalog}}"
              snowflake_database: "{{job.parameters.snowflake_database}}"
              force_full_load: "{{job.parameters.force_full_load}}"
          environment_key: etl_default

        - task_key: silver_sas_scores
          depends_on:
            - task_key: ingest_sas_scores
          notebook_task:
            notebook_path: ../notebooks/etl/02_bronze_to_silver.py
            base_parameters:
              row_index: "3"
              catalog: "${var.catalog}"
              environment: "${var.environment}"
              bronze_schema: "retail_bronze"
              silver_schema: "retail_silver"
              gold_schema: "retail_gold"
              ml_schema: "retail_ml"
          environment_key: etl_default

        # ── SILVER -> GOLD (joins all four) ──────────────────
        - task_key: silver_to_gold
          depends_on:
            - task_key: silver_applications
            - task_key: silver_facilities
            - task_key: silver_credit_performance
            - task_key: silver_sas_scores
          notebook_task:
            notebook_path: ../notebooks/etl/03_silver_to_gold.py
            base_parameters:
              catalog: "${var.catalog}"
          environment_key: etl_default

      environments:
        - environment_key: etl_default
          spec:
            # Spark Snowflake connector + JDBC driver are pre-installed on
            # Databricks serverless — no explicit dependencies required.
            client: "2"
