# ============================================================
# ETL Pipeline: Snowflake -> Bronze -> Silver -> Gold (JDBC only)
# ASB PL Application Scorecard demo
# ============================================================
# Single orchestrating job. 9 source tables across 2 Snowflake DBs
# ingest in parallel, each runs Bronze -> Silver, then a single
# Silver -> Gold join.
#
# Source: DP_CreditApplication.MART (5 tables — origination)
#         DP_CreditManagement.MART (4 tables — performance)
# Inventory: configs/ingestion/master_table_inventory.csv (9 rows)
#
# Each row's source DB / schema / table comes from the CSV — the job
# does not pass snowflake_database (rows target different DBs).
#
# Usage:
#   databricks bundle run etl_pl_application_pipeline --target stg
# ============================================================

resources:
  jobs:

    etl_pl_application_pipeline:
      name: "asb-etl-pl-application-pipeline-${var.environment}"
      description: "PL Application — Snowflake to Gold (9 tables, JDBC, SCD2 + append-only)"
      tags:
        product: "personal_loan"
        pipeline: "etl"
        scorecard_variant: "application"

      parameters:
        - name: catalog
          default: "${var.catalog}"
        - name: environment
          default: "${var.environment}"
        - name: force_full_load
          default: "N"

      # ── Inventory rows in master_table_inventory.csv ──
      # 0 = DIM_SMApplicationRequest          (SCD2,  DP_CreditApplication)
      # 1 = DIM_SMOnyxApplication             (SCD2,  DP_CreditApplication)
      # 2 = DIM_SMApplicationRequestSummary   (SCD2,  DP_CreditApplication)
      # 3 = FACT_SMApplicationRequest         (SCD2,  DP_CreditApplication)
      # 4 = FACT_SMBridgeapplicationfacility  (SCD2,  DP_CreditApplication)
      # 5 = DIM_product                       (full,  DP_CreditManagement)
      # 6 = DIM_facility                      (SCD2,  DP_CreditManagement)
      # 7 = DIM_snapshotdate                  (full,  DP_CreditManagement)
      # 8 = FACT_CreditFacility               (append,DP_CreditManagement)
      tasks:

        # ══════════════ ORIGINATION ══════════════
        - task_key: ingest_dim_app_request
          notebook_task:
            notebook_path: ../notebooks/etl/01_ingest_snowflake.py
            base_parameters:
              table_name: "DIM_SMApplicationRequest"
              catalog: "{{job.parameters.catalog}}"
              force_full_load: "{{job.parameters.force_full_load}}"
          environment_key: etl_default

        - task_key: silver_dim_app_request
          depends_on: [{ task_key: ingest_dim_app_request }]
          notebook_task:
            notebook_path: ../notebooks/etl/02_bronze_to_silver.py
            base_parameters:
              row_index: "0"
              catalog: "${var.catalog}"
              environment: "${var.environment}"
              bronze_schema: "bronze"
              silver_schema: "silver"
              gold_schema: "gold"
              ml_schema: "pl_scorecard"
          environment_key: etl_default

        - task_key: ingest_dim_onyx
          notebook_task:
            notebook_path: ../notebooks/etl/01_ingest_snowflake.py
            base_parameters:
              table_name: "DIM_SMOnyxApplication"
              catalog: "{{job.parameters.catalog}}"
              force_full_load: "{{job.parameters.force_full_load}}"
          environment_key: etl_default

        - task_key: silver_dim_onyx
          depends_on: [{ task_key: ingest_dim_onyx }]
          notebook_task:
            notebook_path: ../notebooks/etl/02_bronze_to_silver.py
            base_parameters:
              row_index: "1"
              catalog: "${var.catalog}"
              environment: "${var.environment}"
              bronze_schema: "bronze"
              silver_schema: "silver"
              gold_schema: "gold"
              ml_schema: "pl_scorecard"
          environment_key: etl_default

        - task_key: ingest_dim_summary
          notebook_task:
            notebook_path: ../notebooks/etl/01_ingest_snowflake.py
            base_parameters:
              table_name: "DIM_SMApplicationRequestSummary"
              catalog: "{{job.parameters.catalog}}"
              force_full_load: "{{job.parameters.force_full_load}}"
          environment_key: etl_default

        - task_key: silver_dim_summary
          depends_on: [{ task_key: ingest_dim_summary }]
          notebook_task:
            notebook_path: ../notebooks/etl/02_bronze_to_silver.py
            base_parameters:
              row_index: "2"
              catalog: "${var.catalog}"
              environment: "${var.environment}"
              bronze_schema: "bronze"
              silver_schema: "silver"
              gold_schema: "gold"
              ml_schema: "pl_scorecard"
          environment_key: etl_default

        - task_key: ingest_fact_app_request
          notebook_task:
            notebook_path: ../notebooks/etl/01_ingest_snowflake.py
            base_parameters:
              table_name: "FACT_SMApplicationRequest"
              catalog: "{{job.parameters.catalog}}"
              force_full_load: "{{job.parameters.force_full_load}}"
          environment_key: etl_default

        - task_key: silver_fact_app_request
          depends_on: [{ task_key: ingest_fact_app_request }]
          notebook_task:
            notebook_path: ../notebooks/etl/02_bronze_to_silver.py
            base_parameters:
              row_index: "3"
              catalog: "${var.catalog}"
              environment: "${var.environment}"
              bronze_schema: "bronze"
              silver_schema: "silver"
              gold_schema: "gold"
              ml_schema: "pl_scorecard"
          environment_key: etl_default

        - task_key: ingest_fact_bridge
          notebook_task:
            notebook_path: ../notebooks/etl/01_ingest_snowflake.py
            base_parameters:
              table_name: "FACT_SMBridgeapplicationfacility"
              catalog: "{{job.parameters.catalog}}"
              force_full_load: "{{job.parameters.force_full_load}}"
          environment_key: etl_default

        - task_key: silver_fact_bridge
          depends_on: [{ task_key: ingest_fact_bridge }]
          notebook_task:
            notebook_path: ../notebooks/etl/02_bronze_to_silver.py
            base_parameters:
              row_index: "4"
              catalog: "${var.catalog}"
              environment: "${var.environment}"
              bronze_schema: "bronze"
              silver_schema: "silver"
              gold_schema: "gold"
              ml_schema: "pl_scorecard"
          environment_key: etl_default

        # ══════════════ MANAGEMENT ══════════════
        - task_key: ingest_dim_product
          notebook_task:
            notebook_path: ../notebooks/etl/01_ingest_snowflake.py
            base_parameters:
              table_name: "DIM_product"
              catalog: "{{job.parameters.catalog}}"
              force_full_load: "{{job.parameters.force_full_load}}"
          environment_key: etl_default

        - task_key: silver_dim_product
          depends_on: [{ task_key: ingest_dim_product }]
          notebook_task:
            notebook_path: ../notebooks/etl/02_bronze_to_silver.py
            base_parameters:
              row_index: "5"
              catalog: "${var.catalog}"
              environment: "${var.environment}"
              bronze_schema: "bronze"
              silver_schema: "silver"
              gold_schema: "gold"
              ml_schema: "pl_scorecard"
          environment_key: etl_default

        - task_key: ingest_dim_facility
          notebook_task:
            notebook_path: ../notebooks/etl/01_ingest_snowflake.py
            base_parameters:
              table_name: "DIM_facility"
              catalog: "{{job.parameters.catalog}}"
              force_full_load: "{{job.parameters.force_full_load}}"
          environment_key: etl_default

        - task_key: silver_dim_facility
          depends_on: [{ task_key: ingest_dim_facility }]
          notebook_task:
            notebook_path: ../notebooks/etl/02_bronze_to_silver.py
            base_parameters:
              row_index: "6"
              catalog: "${var.catalog}"
              environment: "${var.environment}"
              bronze_schema: "bronze"
              silver_schema: "silver"
              gold_schema: "gold"
              ml_schema: "pl_scorecard"
          environment_key: etl_default

        - task_key: ingest_dim_snapshotdate
          notebook_task:
            notebook_path: ../notebooks/etl/01_ingest_snowflake.py
            base_parameters:
              table_name: "DIM_snapshotdate"
              catalog: "{{job.parameters.catalog}}"
              force_full_load: "{{job.parameters.force_full_load}}"
          environment_key: etl_default

        - task_key: silver_dim_snapshotdate
          depends_on: [{ task_key: ingest_dim_snapshotdate }]
          notebook_task:
            notebook_path: ../notebooks/etl/02_bronze_to_silver.py
            base_parameters:
              row_index: "7"
              catalog: "${var.catalog}"
              environment: "${var.environment}"
              bronze_schema: "bronze"
              silver_schema: "silver"
              gold_schema: "gold"
              ml_schema: "pl_scorecard"
          environment_key: etl_default

        - task_key: ingest_fact_credit_facility
          notebook_task:
            notebook_path: ../notebooks/etl/01_ingest_snowflake.py
            base_parameters:
              table_name: "FACT_CreditFacility"
              catalog: "{{job.parameters.catalog}}"
              force_full_load: "{{job.parameters.force_full_load}}"
          environment_key: etl_default

        - task_key: silver_fact_credit_facility
          depends_on: [{ task_key: ingest_fact_credit_facility }]
          notebook_task:
            notebook_path: ../notebooks/etl/02_bronze_to_silver.py
            base_parameters:
              row_index: "8"
              catalog: "${var.catalog}"
              environment: "${var.environment}"
              bronze_schema: "bronze"
              silver_schema: "silver"
              gold_schema: "gold"
              ml_schema: "pl_scorecard"
          environment_key: etl_default

        # ══════════════ SILVER -> GOLD ══════════════
        - task_key: silver_to_gold
          depends_on:
            - { task_key: silver_dim_app_request }
            - { task_key: silver_dim_onyx }
            - { task_key: silver_dim_summary }
            - { task_key: silver_fact_app_request }
            - { task_key: silver_fact_bridge }
            - { task_key: silver_dim_product }
            - { task_key: silver_dim_facility }
            - { task_key: silver_dim_snapshotdate }
            - { task_key: silver_fact_credit_facility }
          notebook_task:
            notebook_path: ../notebooks/etl/03_silver_to_gold.py
            base_parameters:
              catalog: "${var.catalog}"
          environment_key: etl_default

      environments:
        - environment_key: etl_default
          spec:
            # Spark Snowflake connector + JDBC driver are pre-installed on
            # Databricks serverless — no explicit dependencies required.
            client: "2"
