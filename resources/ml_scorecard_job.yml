# ============================================================
# ML Scorecard Jobs: Config-Driven Model Lifecycle
# ============================================================
# Each scorecard model gets its own job with a 5-task chain:
#   Task 1: 01_data_prep       (Silver → Gold ML-ready data)
#   Task 2: 02_feature_engineering (WoE/IV, banding, feature store)
#   Task 3: 03_model_training  (Train + register in UC)
#   Task 4: 04_model_scoring   (Batch score + risk grades)
#   Task 5: 05_model_monitoring (Drift detection + alerting)
#
# Usage:
#   databricks bundle run ml_hl_behaviour_scorecard --target dev
# ============================================================

resources:
  jobs:

    # ── Home Loan Behaviour Scorecard ──
    ml_hl_behaviour_scorecard:
      name: "asb-ml-hl-scorecard-${var.environment}"
      description: "Home Loan Customer Behaviour Scorecard — full ML lifecycle"
      tags:
        product: "home_loan"
        use_case: "credit_risk_pd"
        framework: "ml_scorecard"

      parameters:
        - name: model_name
          default: "hl_behaviour_scorecard"
        - name: catalog
          default: "${var.catalog}"

      tasks:
        # ── Task 1: Data Preparation ──
        - task_key: data_prep
          notebook_task:
            notebook_path: ../notebooks/ml/01_data_prep.py
            base_parameters:
              model_name: "{{job.parameters.model_name}}"
              catalog: "{{job.parameters.catalog}}"
          environment_key: ml_default

        # ── Task 2: Feature Engineering ──
        - task_key: feature_engineering
          depends_on:
            - task_key: data_prep
          notebook_task:
            notebook_path: ../notebooks/ml/02_feature_engineering.py
            base_parameters:
              model_name: "{{job.parameters.model_name}}"
              catalog: "{{job.parameters.catalog}}"
          environment_key: ml_default

        # ── Task 3: Model Training ──
        - task_key: model_training
          depends_on:
            - task_key: feature_engineering
          notebook_task:
            notebook_path: ../notebooks/ml/03_model_training.py
            base_parameters:
              model_name: "{{job.parameters.model_name}}"
              catalog: "{{job.parameters.catalog}}"
          environment_key: ml_default

        # ── Task 4: Model Scoring ──
        - task_key: model_scoring
          depends_on:
            - task_key: model_training
          notebook_task:
            notebook_path: ../notebooks/ml/04_model_scoring.py
            base_parameters:
              model_name: "{{job.parameters.model_name}}"
              catalog: "{{job.parameters.catalog}}"
          environment_key: ml_default

        # ── Task 5: Model Monitoring ──
        - task_key: model_monitoring
          depends_on:
            - task_key: model_scoring
          notebook_task:
            notebook_path: ../notebooks/ml/05_model_monitoring.py
            base_parameters:
              model_name: "{{job.parameters.model_name}}"
              catalog: "{{job.parameters.catalog}}"
          environment_key: ml_default

      environments:
        - environment_key: ml_default
          spec:
            client: "2"
