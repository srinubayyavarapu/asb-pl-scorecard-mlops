# ============================================================
# ASB PL Application Scorecard - CI Workflow (Staging)
# ============================================================
# Triggers on push to `main`.
#   1. Validate bundle for stg
#   2. Deploy bundle to stg
#   3. Run ml_pl_unit_tests job in stg and wait (fast pytest gate)
#   4. If green -> auto-create PR main -> release
#
# Integration tests (ETL + Training + Inference) are commented out
# below for budget — uncomment any of them when you want CI to run
# the real pipelines too.
#
# GitHub Environment: `staging`
#   Secrets expected on the staging environment:
#     DATABRICKS_HOST   = https://adb-7405618551622593.13.azuredatabricks.net
#     DATABRICKS_TOKEN  = (PAT or service-principal token)
# ============================================================

name: ML CI - Deploy + Unit Tests in Staging

on:
  push:
    branches:
      - main
    paths:
      - 'notebooks/**'
      - 'tests/**'
      - 'resources/*.yml'
      - 'configs/ingestion/**'
      - 'databricks.yml'
      - '.github/workflows/ml-tests-ci.yml'

  workflow_dispatch: {}

concurrency:
  group: ml-ci-staging
  cancel-in-progress: false

env:
  DBX_CLI_VERSION: '0.298.0'

jobs:

  deploy-and-test-stg:
    name: Deploy to stg + run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI v${{ env.DBX_CLI_VERSION }}
        run: |
          set -e
          curl -fsSL "https://github.com/databricks/cli/releases/download/v${DBX_CLI_VERSION}/databricks_cli_${DBX_CLI_VERSION}_linux_amd64.zip" -o dbx.zip
          unzip -o dbx.zip -d /tmp/dbx
          sudo mv /tmp/dbx/databricks /usr/local/bin/databricks
          databricks --version

      - name: Validate bundle for stg
        run: databricks bundle validate -t stg

      - name: Deploy bundle to stg
        run: databricks bundle deploy -t stg

      - name: Run unit_tests job in stg (waits — fails CI on any test failure)
        run: databricks bundle run ml_pl_unit_tests -t stg

      # ─── Integration tests — commented for budget conservation ──────────
      # Uncomment any of the steps below to have CI also run the real
      # pipelines in stg. Each adds 5-10 min and stg-workspace compute cost.
      #
      # - name: Run ETL pipeline in stg (Snowflake -> Bronze -> Silver -> Gold)
      #   run: databricks bundle run etl_pl_application_pipeline -t stg
      #
      # - name: Run ML training in stg (registers @Challenger)
      #   run: databricks bundle run ml_pl_training -t stg
      #
      # - name: Run ML inference in stg (scores TTD, runs monitor)
      #   run: databricks bundle run ml_pl_inference -t stg
      # ────────────────────────────────────────────────────────────────────

      - name: CI summary
        run: |
          echo "=========================================="
          echo "Staging CI passed: bundle deployed + unit tests green"
          echo "=========================================="
          echo ""
          echo "Job definitions in stg workspace:"
          echo "  - etl_pl_application_pipeline   (Snowflake -> Bronze -> Silver -> Gold)"
          echo "  - ml_pl_unit_tests              (pytest gate)"
          echo "  - ml_pl_training                (registers @Challenger)"
          echo "  - ml_pl_deployment              (gated on approval=approved UC tag)"
          echo "  - ml_pl_inference               (uses @Champion)"
          echo ""
          echo "ETL / training / inference are commented in this workflow."
          echo "Uncomment to run them in CI; otherwise trigger them on demand"
          echo "via databricks bundle run."

  create-release-pr:
    name: Auto-create PR main -> release
    needs: deploy-and-test-stg
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open PR main -> release (skip if main has no commits ahead of release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Skip cleanly when nothing to PR — keeps CI green on no-op pushes
          ahead=$(git rev-list --count origin/release..origin/main)
          if [ "$ahead" = "0" ]; then
            echo "main has 0 commits ahead of release; nothing to PR."
            exit 0
          fi
          existing=$(gh pr list --base release --head main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing already open between main and release."
            exit 0
          fi
          gh pr create \
            --base release \
            --head main \
            --title "Release: Deploy to Production (CI passed - run #${{ github.run_number }})" \
            --body "Auto-created by CI after staging deploy + unit tests passed.

          Build:  ${{ github.run_number }}
          Commit: ${{ github.sha }}

          Merging this PR triggers the CD workflow which deploys job
          definitions to the prod workspace. Production model promotion
          still requires a manual UC tag (\`approval=approved\`) per
          APRA / RBNZ separation of duties."
