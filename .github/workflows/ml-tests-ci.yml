# ============================================================
# ASB PL Application Scorecard - CI Workflow (Staging)
# ============================================================
# Triggers on push to `main`.
#   1. Validate bundle for stg
#   2. Deploy bundle to stg
#   3. Run the ETL job in stg and wait for completion (real
#      end-to-end test — Snowflake -> Bronze -> Silver -> Gold)
#   4. Auto-create PR main -> release if tests pass
#
# GitHub Environment: `staging`
#   Secrets expected on the staging environment:
#     DATABRICKS_HOST   = https://adb-7405618551622593.13.azuredatabricks.net
#     DATABRICKS_TOKEN  = (PAT or service-principal token)
# ============================================================

name: ML CI - Deploy + ETL Test in Staging

on:
  push:
    branches:
      - main
    # NOTE: path filter intentionally removed. CI fires on every push
    # to main so the demo never silently skips because the push touched
    # a file outside the filter (README, scripts, etc.).
  workflow_dispatch: {}

concurrency:
  group: ml-ci-staging
  cancel-in-progress: false

env:
  DBX_CLI_VERSION: '0.298.0'

jobs:

  deploy-and-test-stg:
    name: Deploy to stg + run ETL pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI v${{ env.DBX_CLI_VERSION }}
        run: |
          set -e
          curl -fsSL "https://github.com/databricks/cli/releases/download/v${DBX_CLI_VERSION}/databricks_cli_${DBX_CLI_VERSION}_linux_amd64.zip" -o dbx.zip
          unzip -o dbx.zip -d /tmp/dbx
          sudo mv /tmp/dbx/databricks /usr/local/bin/databricks
          databricks --version

      - name: Validate bundle for stg
        run: databricks bundle validate -t stg

      - name: Deploy bundle to stg
        run: databricks bundle deploy -t stg

      - name: Run ETL pipeline in stg (foreground — fails the CI if the job fails)
        run: databricks bundle run etl_pl_application_pipeline -t stg

      - name: Test summary
        run: |
          echo "=========================================="
          echo "Staging deployment + ETL test passed"
          echo "=========================================="
          echo "Snowflake -> Bronze -> Silver -> Gold flow verified."

  create-release-pr:
    name: Auto-create PR main -> release
    needs: deploy-and-test-stg
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open PR main -> release (skip if nothing to PR or one is already open)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Skip cleanly when main has 0 commits ahead of release — otherwise
          # `gh pr create` errors with "No commits between..." and fails CI.
          ahead=$(git rev-list --count origin/release..origin/main)
          if [ "$ahead" = "0" ]; then
            echo "main has 0 commits ahead of release; nothing to PR. Skipping."
            exit 0
          fi
          existing=$(gh pr list --base release --head main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing already open between main and release. Nothing to do."
            exit 0
          fi
          gh pr create \
            --base release \
            --head main \
            --title "Release: Deploy to Production (CI passed - run #${{ github.run_number }})" \
            --body "Auto-created by CI after staging deployment + ETL test passed.

          Build:  ${{ github.run_number }}
          Commit: ${{ github.sha }}

          Merging this PR triggers the CD workflow which deploys job
          definitions to the prod workspace. Production model promotion
          still requires a manual UC tag (\`approval=approved\`) per
          APRA / RBNZ separation of duties."
