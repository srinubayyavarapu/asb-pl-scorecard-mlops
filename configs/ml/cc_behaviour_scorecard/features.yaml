# Feature Engineering Config - Credit Card Behaviour Scorecard

iv_thresholds:
  exclude_below: 0.02
  weak_below: 0.10
  suspicious_above: 0.50

features:
  - name: "credit_score"
    type: "continuous"
    banding_method: "auto"
    monotonicity: "descending"

  - name: "annual_income"
    type: "continuous"
    banding_method: "auto"
    monotonicity: "descending"

  - name: "credit_utilization_ratio"
    type: "continuous"
    banding_method: "auto"
    monotonicity: "ascending"

  - name: "debt_to_income_ratio"
    type: "continuous"
    banding_method: "auto"
    monotonicity: "ascending"

  - name: "number_of_late_payments"
    type: "continuous"
    banding_method: "auto"
    monotonicity: "ascending"

  - name: "number_of_credit_lines"
    type: "continuous"
    banding_method: "auto"
    monotonicity: null

  - name: "tenure_in_years"
    type: "continuous"
    banding_method: "auto"
    monotonicity: "descending"

  - name: "total_spend_last_year"
    type: "continuous"
    banding_method: "auto"
    monotonicity: null

  - name: "fraud_transactions"
    type: "continuous"
    banding_method: "auto"
    monotonicity: "ascending"

  - name: "age"
    type: "continuous"
    banding_method: "auto"
    monotonicity: null

auto_banding:
  max_bins: 10
  min_bin_size: 0.05
  min_bad_count: 20

banding_table: "${catalog}.retail_gold.cc_banding_lookup"
woe_iv_table: "${catalog}.retail_gold.cc_woe_iv"
feature_store_table: "${catalog}.retail_ml.cc_feature_store"
