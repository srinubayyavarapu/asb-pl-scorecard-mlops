# Model Scoring Config - Credit Card Behaviour Scorecard

scorecard_scaling:
  target_score: 600
  target_odds: 50
  pdo: 20

risk_grades:
  - grade: "A1"
    score_min: 750
    score_max: 999
    pd_min: 0.000
    pd_max: 0.005
  - grade: "A2"
    score_min: 700
    score_max: 749
    pd_min: 0.005
    pd_max: 0.01
  - grade: "B1"
    score_min: 650
    score_max: 699
    pd_min: 0.01
    pd_max: 0.025
  - grade: "B2"
    score_min: 600
    score_max: 649
    pd_min: 0.025
    pd_max: 0.05
  - grade: "C1"
    score_min: 550
    score_max: 599
    pd_min: 0.05
    pd_max: 0.1
  - grade: "C2"
    score_min: 500
    score_max: 549
    pd_min: 0.1
    pd_max: 0.2
  - grade: "D"
    score_min: 0
    score_max: 499
    pd_min: 0.2
    pd_max: 1.0

input_table: "${catalog}.retail_gold.cc_scorecard_dev_data"
output_table: "${catalog}.retail_gold.cc_scored_output"
schedule: "monthly"
