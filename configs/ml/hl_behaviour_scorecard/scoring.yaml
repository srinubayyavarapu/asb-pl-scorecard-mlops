# ============================================================
# Model Scoring Config - Home Loan Behaviour Scorecard
# ============================================================

# Scorecard scaling parameters
scorecard_scaling:
  target_score: 600        # Score at target odds
  target_odds: 50          # Good:Bad ratio at target score (50:1)
  pdo: 20                  # Points to Double the Odds

# Risk grade definitions
risk_grades:
  - grade: "A1"
    score_min: 750
    score_max: 999
    pd_min: 0.000
    pd_max: 0.005
  - grade: "A2"
    score_min: 700
    score_max: 749
    pd_min: 0.005
    pd_max: 0.010
  - grade: "B1"
    score_min: 650
    score_max: 699
    pd_min: 0.010
    pd_max: 0.025
  - grade: "B2"
    score_min: 600
    score_max: 649
    pd_min: 0.025
    pd_max: 0.050
  - grade: "C1"
    score_min: 550
    score_max: 599
    pd_min: 0.050
    pd_max: 0.100
  - grade: "C2"
    score_min: 500
    score_max: 549
    pd_min: 0.100
    pd_max: 0.200
  - grade: "D"
    score_min: 0
    score_max: 499
    pd_min: 0.200
    pd_max: 1.000

# Input / Output
input_table: "${catalog}.retail_gold.hl_scorecard_dev_data"
output_table: "${catalog}.retail_gold.hl_scored_output"
schedule: "monthly"
