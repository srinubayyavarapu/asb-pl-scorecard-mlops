# ============================================================
# Snowflake Tables Inventory
# ============================================================
# Lists all tables to ingest from Snowflake into Delta Lake.
# ingestion_mode:
#   - "jdbc"        → Full copy into Delta Bronze (default)
#   - "federation"  → Query in place via Lakehouse Federation (no data movement)
#
# To onboard a new table: add an entry below and re-run the ETL pipeline.
# ============================================================

# ── Snowflake Connection ──
connection:
  # Federation: Unity Catalog foreign catalog name
  federation_catalog: "snowflake_asb"

  # JDBC: Connection details (secrets stored in Key Vault / Databricks Secrets)
  jdbc:
    host_secret: "snowflake-host"
    user_secret: "snowflake-user"
    password_secret: "snowflake-password"
    database: "ASB_ANALYTICS"
    warehouse: "COMPUTE_WH"
    role: "DATA_READER"
    secret_scope: "asb-secrets"

# ── Tables ──
tables:
