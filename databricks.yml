# ASB Credit Risk MLOps — Databricks Asset Bundle
# Credit Card Behaviour Scorecard (demo bundle)
# ASB-SAS-DBX-Migration
# Test CI/CD

bundle:
  name: asb-credit-risk-mlops

variables:
  environment:
    description: "Deployment environment (dev / stg / prod)"
    default: dev
  catalog:
    description: "Unity Catalog — one per environment"
    default: dev_retail_modelling
  snowflake_database:
    description: "Snowflake source database for this environment (one DB per env, UC best practice)"
    default: "DP_CREDITMANAGEMENT_DEV"
  notify_email:
    description: "Email for ML pipeline notifications"
    default: "bayyavarapusrinu1@gmail.com"

include:
  - resources/*.yml   # Bundle includes both ETL and ML jobs

sync:
  # Bundle deploys ONLY runtime artefacts: ETL + ML notebooks, utils,
  # job YAMLs, and the metadata-driven master CSV. Everything else
  # listed below stays in the git repo for reference but is not pushed
  # to the workspace.
  exclude:
    # Documentation, reference data, tests
    - docs/**
    - data/**
    - reference/**
    - tests/**
    - workflow-manager.md
    - CLAUDE.md
    - README.md
    - "*.md"
    # Operational scripts (run locally, not in workspace)
    - scripts/**
    # CI/CD and developer tooling
    - .github/**
    - .claude/**
    - .vscode/**
    - .idea/**
    - .databricks/**
    - .pytest_cache/**
    # MCP / Claude Code helpers (kept in repo, not deployed)
    - .mcp.json
    - config/**
    # Python build artefacts
    - __pycache__/**
    - "**/__pycache__/**"
    - "*.pyc"
    - .venv/**
    - venv/**
    # Setup notebooks - run manually one-off, not part of bundle
    - notebooks/setup/**

# ──────────────────────────────────────────────
# Targets — one UC-enabled workspace per environment
# ──────────────────────────────────────────────

targets:

  dev:
    default: true
    mode: development
    variables:
      environment: dev
      catalog: dev_retail_modelling
      snowflake_database: DP_CREDITMANAGEMENT_DEV
    workspace:
      host: https://adb-7405618935161265.5.azuredatabricks.net

  stg:
    variables:
      environment: stg
      catalog: stg_retail_modelling
      snowflake_database: DP_CREDITMANAGEMENT_STG
    workspace:
      host: https://adb-7405610706859452.12.azuredatabricks.net

  prod:
    variables:
      environment: prod
      catalog: prod_retail_modelling
      snowflake_database: DP_CREDITMANAGEMENT_PRD
    workspace:
      host: https://adb-7405614555582503.3.azuredatabricks.net
