# ASB Credit Risk MLOps — Databricks Asset Bundle
# Credit Card Behaviour Scorecard (demo bundle)
# ASB-SAS-DBX-Migration
# Test CI/CD

bundle:
  name: asb-credit-risk-mlops

variables:
  environment:
    description: "Deployment environment (dev / stg / prod)"
    default: dev
  catalog:
    description: "Unity Catalog — one per environment"
    default: asb_dev
  notify_email:
    description: "Email for ML pipeline notifications"
    default: "bayyavarapusrinu1@gmail.com"

include:
  - resources/ml_*.yml   # ML bundle only — excludes ETL (etl_ingestion_job.yml)

sync:
  exclude:
    - docs/**
    - data/**
    - reference/**
    - tests/**
    - .azure-pipelines/**
    - .claude/**
    - configs/ingestion/**
    - notebooks/etl/**
    - notebooks/setup/00_init_workspace.py
    - notebooks/setup/00_setup_sample_data.py
    - notebooks/setup/01_setup_snowflake_federation.py
    - notebooks/setup/02_setup_uc_permissions.py
    - CLAUDE.md
    - "*.md"

# ──────────────────────────────────────────────
# Targets — one UC-enabled workspace per environment
# ──────────────────────────────────────────────

targets:

  dev:
    default: true
    mode: development
    variables:
      environment: dev
      catalog: asb_dev
    workspace:
      host: https://adb-7405618935161265.5.azuredatabricks.net

  stg:
    variables:
      environment: stg
      catalog: asb_stg
    workspace:
      host: https://adb-7405610706859452.12.azuredatabricks.net

  prod:
    variables:
      environment: prod
      catalog: asb_prd
    workspace:
      host: https://adb-7405614555582503.3.azuredatabricks.net
