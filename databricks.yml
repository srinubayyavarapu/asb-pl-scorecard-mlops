# ASB Credit Risk MLOps — Databricks Asset Bundle
# Credit Card Behaviour Scorecard (demo bundle)
# ASB-SAS-DBX-Migration
# Test CI/CD

bundle:
  name: asb-credit-risk-mlops

variables:
  environment:
    description: "Deployment environment (stg / prod)"
    default: stg
  catalog:
    description: "Unity Catalog — one per environment (each target overrides)"
    default: ""
  snowflake_db_application:
    description: "Snowflake origination DB (FACT_SM* / DIM_SM* tables)"
    default: "DP_CreditApplication"
  snowflake_db_management:
    description: "Snowflake account-management DB (FACT_CreditFacility / DIM_facility / DIM_product / DIM_snapshotdate)"
    default: "DP_CreditManagement"
  notify_email:
    description: "Email for ML pipeline notifications"
    default: "bayyavarapusrinu1@gmail.com"

include:
  - resources/*.yml   # Bundle includes both ETL and ML jobs

sync:
  # Bundle deploys ONLY runtime artefacts: ETL + ML notebooks, utils,
  # job YAMLs, and the metadata-driven master CSV. Everything else
  # listed below stays in the git repo for reference but is not pushed
  # to the workspace.
  exclude:
    # Documentation, reference data, tests
    - docs/**
    - data/**
    - reference/**
    - tests/**
    - workflow-manager.md
    - CLAUDE.md
    - README.md
    - "*.md"
    # Operational scripts (run locally, not in workspace)
    - scripts/**
    # CI/CD and developer tooling
    - .github/**
    - .claude/**
    - .vscode/**
    - .idea/**
    - .databricks/**
    - .pytest_cache/**
    # MCP / Claude Code helpers (kept in repo, not deployed)
    - .mcp.json
    - config/**
    # Python build artefacts
    - __pycache__/**
    - "**/__pycache__/**"
    - "*.pyc"
    - .venv/**
    - venv/**
    # Setup notebooks - run manually one-off, not part of bundle
    - notebooks/setup/**

# ──────────────────────────────────────────────
# Targets — one UC-enabled workspace per environment
# ──────────────────────────────────────────────

targets:

  stg:
    default: true
    mode: development
    variables:
      environment: stg
      catalog: stg_retail_modeling
    workspace:
      host: https://adb-7405618551622593.13.azuredatabricks.net

  prod:
    variables:
      environment: prod
      catalog: prod_retail_modeling
    workspace:
      host: https://adb-7405609196403590.10.azuredatabricks.net
