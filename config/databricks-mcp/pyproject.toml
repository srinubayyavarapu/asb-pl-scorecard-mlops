[project]
name = "databricks-mcp-server"
version = "0.1.0"
description = "Databricks MCP Server for ASB SAS-to-Databricks Migration Framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.25.0",
    "databricks-sdk>=0.40.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
databricks-mcp = "server:main"
