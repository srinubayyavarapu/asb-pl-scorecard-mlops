# ============================================================
# ML Scorecard Framework - CI Pipeline
# ============================================================
# Triggered: automatically when code is merged to main branch
#
# Flow:
#   1. Push to Feature -> auto PR to main (via branch policy)
#   2. Reviewer merges PR to main
#   3. This CI pipeline triggers:
#      - Stage 1: Unit Tests (on agent)
#      - Stage 2: Integration Tests (deploy + run on staging)
#   4. CI passes -> auto-creates PR from main to release
# ============================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - configs/ml/**
      - notebooks/ml/**
      - resources/ml_scorecard_job.yml
      - databricks.yml
      - tests/**

pr: none

variables:
  - group: asb-ml-variables
  - name: workingDirectory
    value: $(Build.SourcesDirectory)

stages:

  # ── Stage 1: Unit Tests + Integration Tests ──
  - stage: CI
    displayName: "CI - Test & Validate"

    jobs:
      # ── Job 1: Unit Tests ──
      - job: UnitTests
        displayName: "Unit Tests"
        pool:
          vmImage: "ubuntu-latest"

        steps:
          - checkout: self
            persistCredentials: true
            clean: true

          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.11"

          - script: |
              python -m pip install --upgrade pip
              pip install pyyaml pytest
            displayName: "Install dependencies"

          - script: |
              pytest tests/ --junitxml=test-unit.xml -v
            displayName: "Run unit tests with pytest"
            workingDirectory: $(workingDirectory)

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: "**/test-unit.xml"
              testRunTitle: "ML Framework Unit Tests"

      # ── Job 2: Integration Tests ──
      - job: IntegrationTests
        displayName: "Integration Tests"
        dependsOn: UnitTests
        condition: succeeded()
        pool:
          vmImage: "ubuntu-latest"

        steps:
          - checkout: self
            persistCredentials: true
            clean: true

          - script: |
              curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
            displayName: "Install Databricks CLI"

          - script: databricks version
            displayName: "Verify CLI installation"

          - script: databricks bundle validate -t stg
            workingDirectory: $(workingDirectory)
            displayName: "Validate bundle for staging"
            env:
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

          - script: databricks bundle validate -t prod
            workingDirectory: $(workingDirectory)
            displayName: "Validate bundle for prod"
            env:
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

          - script: databricks bundle deploy -t stg
            workingDirectory: $(workingDirectory)
            displayName: "Deploy bundle to staging"
            env:
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

          - script: databricks bundle run ml_hl_behaviour_scorecard -t stg
            workingDirectory: $(workingDirectory)
            displayName: "Run ML pipeline in staging"
            env:
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

  # ── Stage 2: Auto-create PR from main to release ──
  - stage: CreateReleasePR
    displayName: "Create Release PR"
    dependsOn: CI
    condition: succeeded()

    jobs:
      - job: CreatePR
        displayName: "Auto-create PR: main -> release"
        pool:
          vmImage: "ubuntu-latest"

        steps:
          - checkout: self
            persistCredentials: true
            clean: true

          - script: |
              PR_RESPONSE=$(curl -s -X POST \
                -H "Content-Type: application/json" \
                -u ":$(System.AccessToken)" \
                "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_apis/git/repositories/$(Build.Repository.Name)/pullrequests?api-version=7.0" \
                -d '{
                  "sourceRefName": "refs/heads/main",
                  "targetRefName": "refs/heads/release",
                  "title": "Release: Deploy to Production (CI passed - Build $(Build.BuildNumber))",
                  "description": "Auto-created by CI pipeline after successful staging validation.\n\nBuild: $(Build.BuildNumber)\nCommit: $(Build.SourceVersion)\n\nCI Results:\n- Unit Tests: Passed\n- Integration Tests: Passed (staging deployment validated)"
                }')

              echo "$PR_RESPONSE"

              PR_ID=$(echo "$PR_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('pullRequestId','FAILED'))" 2>/dev/null)

              if [ "$PR_ID" != "FAILED" ] && [ -n "$PR_ID" ]; then
                echo "PR created successfully: #$PR_ID"
                echo "Waiting for reviewer approval to deploy to production."
              else
                echo "PR creation skipped (may already exist or branch not found)"
              fi
            displayName: "Create PR: main -> release"
            env:
              System.AccessToken: $(System.AccessToken)
