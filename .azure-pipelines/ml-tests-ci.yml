# ============================================================
# ML Scorecard Framework - CI Pipeline (Staging)
# ============================================================
# Triggers on push to `main`.
#   1. Validate bundle for stg + prod
#   2. Deploy bundle to stg
#   3. Run the 3 CC jobs end-to-end on stg
#   4. Auto-create PR main -> release
#
# Variable group: asb-ml-vars-stg
#   DATABRICKS_HOST  - stg workspace URL
#   DATABRICKS_TOKEN - stg PAT / SPN token
# ============================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - notebooks/ml/**
      - resources/ml_*.yml
      - databricks.yml

pr: none

variables:
  - group: asb-ml-vars-stg
  - name: workingDirectory
    value: $(Build.SourcesDirectory)
  - name: DBX_CLI_VERSION
    value: "0.298.0"

stages:

  - stage: CI
    displayName: "CI - Deploy + Run on Staging"

    jobs:
      - job: IntegrationTests
        displayName: "Deploy + Run on Staging"
        pool:
          vmImage: "ubuntu-latest"
        timeoutInMinutes: 45

        steps:
          - checkout: self
            persistCredentials: true
            clean: true

          - script: |
              set -e
              curl -fsSL "https://github.com/databricks/cli/releases/download/v${DBX_CLI_VERSION}/databricks_cli_${DBX_CLI_VERSION}_linux_amd64.zip" -o dbx.zip
              unzip -o dbx.zip -d /tmp/dbx
              sudo mv /tmp/dbx/databricks /usr/local/bin/databricks
              databricks --version
            displayName: "Install Databricks CLI v$(DBX_CLI_VERSION)"

          - script: databricks bundle validate -t stg
            workingDirectory: $(workingDirectory)
            displayName: "Validate bundle for stg"
            env:
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

          - script: databricks bundle deploy -t stg
            workingDirectory: $(workingDirectory)
            displayName: "Deploy bundle to stg"
            env:
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

          - script: |
              set -e
              for job in ml_cc_training ml_cc_deployment ml_cc_inference; do
                echo "=== Running: $job ==="
                databricks bundle run "$job" -t stg
              done
              echo "All 3 CC pipelines passed on stg"
            workingDirectory: $(workingDirectory)
            displayName: "Run CC pipelines on stg (training -> deployment -> inference)"
            env:
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

  - stage: CreateReleasePR
    displayName: "Create Release PR"
    dependsOn: CI
    condition: succeeded()

    jobs:
      - job: CreatePR
        displayName: "Auto-create PR: main -> release"
        pool:
          vmImage: "ubuntu-latest"

        steps:
          - checkout: self
            persistCredentials: true
            clean: true

          - script: |
              PR_RESPONSE=$(curl -s -X POST \
                -H "Content-Type: application/json" \
                -u ":$(System.AccessToken)" \
                "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_apis/git/repositories/$(Build.Repository.Name)/pullrequests?api-version=7.0" \
                -d '{
                  "sourceRefName": "refs/heads/main",
                  "targetRefName": "refs/heads/release",
                  "title": "Release: Deploy to Production (CI passed - Build $(Build.BuildNumber))",
                  "description": "Auto-created by CI pipeline after successful staging validation.\n\nBuild: $(Build.BuildNumber)\nCommit: $(Build.SourceVersion)"
                }')

              echo "$PR_RESPONSE"

              PR_ID=$(echo "$PR_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('pullRequestId','FAILED'))" 2>/dev/null)

              if [ "$PR_ID" != "FAILED" ] && [ -n "$PR_ID" ]; then
                echo "PR created successfully: #$PR_ID"
              else
                echo "PR creation skipped (may already exist or branch not found)"
              fi
            displayName: "Create PR: main -> release"
            env:
              System.AccessToken: $(System.AccessToken)
