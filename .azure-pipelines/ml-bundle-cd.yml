# ============================================================
# ASB PL Application Scorecard - CD Pipeline (Production)
# ============================================================
# Triggers on push to `release`.
#   1. Validate bundle for prod
#   2. Deploy bundle (ETL + ML job definitions) to prod
#
# Production jobs run on their own schedules:
#   - ETL:         monthly (drives bronze refresh from Snowflake)
#   - Training:    1st of each month
#   - Deployment:  manual / triggered by MLflow Deployment Jobs
#                  (requires `approval=approved` UC tag — APRA gate)
#   - Inference:   weekly (Monday)
#
# Variable group: asb-ml-vars-prod
#   DATABRICKS_HOST  - prod workspace URL
#   DATABRICKS_TOKEN - prod PAT / SPN token
# ============================================================

trigger:
  branches:
    include:
      - release
  paths:
    include:
      - notebooks/ml/**
      - notebooks/etl/**
      - notebooks/utils/**
      - resources/ml_*.yml
      - resources/etl_*.yml
      - configs/ingestion/**
      - databricks.yml

pr: none

variables:
  - group: asb-ml-vars-prod
  - name: DBX_CLI_VERSION
    value: "0.298.0"

stages:

  - stage: CD
    displayName: "CD - Deploy to Production"

    jobs:
      - deployment: DeployProd
        displayName: "Production Deployment"
        environment: "production"
        pool:
          vmImage: "ubuntu-latest"

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  persistCredentials: true
                  clean: true

                - script: |
                    set -e
                    curl -fsSL "https://github.com/databricks/cli/releases/download/v${DBX_CLI_VERSION}/databricks_cli_${DBX_CLI_VERSION}_linux_amd64.zip" -o dbx.zip
                    unzip -o dbx.zip -d /tmp/dbx
                    sudo mv /tmp/dbx/databricks /usr/local/bin/databricks
                    databricks --version
                  displayName: "Install Databricks CLI v$(DBX_CLI_VERSION)"

                - script: databricks bundle validate -t prod
                  displayName: "Validate bundle for prod"
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

                - script: databricks bundle deploy -t prod
                  displayName: "Deploy bundle to prod (ETL + ML job definitions)"
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

                - script: |
                    echo "=========================================="
                    echo "Production deployment complete"
                    echo "=========================================="
                    echo ""
                    echo "Job definitions deployed to prod workspace:"
                    echo "  - etl_pl_application_pipeline (Snowflake -> Bronze -> Silver -> Gold)"
                    echo "  - ml_pl_training       (registers @Challenger)"
                    echo "  - ml_pl_deployment     (gated on approval=approved UC tag)"
                    echo "  - ml_pl_inference      (uses @Champion)"
                    echo ""
                    echo "Jobs execute on their own schedules. Model promotion"
                    echo "requires manual UC tag approval per APRA validation."
                  displayName: "Deployment summary"
