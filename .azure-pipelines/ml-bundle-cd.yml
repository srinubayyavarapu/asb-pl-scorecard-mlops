# ============================================================
# ML Scorecard Framework - CD Pipeline (Production)
# ============================================================
# Triggered: automatically when code is merged to release branch
#
# Flow:
#   1. CI pipeline passes on main -> auto-creates PR: main -> release
#   2. Reviewer approves and merges PR to release
#   3. This CD pipeline triggers:
#      - Validate bundle for production
#      - Deploy to production
#      - Run ML pipeline in production
# ============================================================

trigger:
  branches:
    include:
      - release
  paths:
    include:
      - configs/ml/**
      - notebooks/ml/**
      - resources/ml_scorecard_job.yml
      - databricks.yml

pr: none

variables:
  - group: asb-ml-variables

stages:

  - stage: CD
    displayName: "CD - Deploy to Production"

    jobs:
      - deployment: DeployProd
        displayName: "Production Deployment"
        environment: "production"
        pool:
          vmImage: "ubuntu-latest"

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  persistCredentials: true
                  clean: true

                - script: |
                    curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
                  displayName: "Install Databricks CLI"

                - script: databricks version
                  displayName: "Verify CLI installation"

                - script: databricks bundle validate -t prod
                  displayName: "Validate bundle for prod"
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

                - script: databricks bundle deploy -t prod
                  displayName: "Deploy bundle to prod"
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

                - script: |
                    pip install pyyaml -q
                    python -c "
                    import yaml, subprocess, sys
                    with open('configs/ml/model_registry.yaml') as f:
                        models = yaml.safe_load(f)['models']
                    for name, cfg in models.items():
                        if cfg.get('is_active'):
                            job_name = f'ml_{name}'
                            print(f'Running: {job_name}')
                            result = subprocess.run(['databricks', 'bundle', 'run', job_name, '-t', 'prod'], capture_output=False)
                            if result.returncode != 0:
                                print(f'FAILED: {job_name}')
                                sys.exit(1)
                    print('All active models passed')
                    "
                  displayName: "Run active ML pipelines in prod"
                  env:
                    DATABRICKS_HOST: $(DATABRICKS_HOST)
                    DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
